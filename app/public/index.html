<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App · GitOps</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #16181d;
      --muted: #5f6673;
      --line: #e3e5ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 28px 24px 64px;
      transition: background 0.6s;
    }
    header .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 26px; font-weight: 650; }
    .version { font-family: Consolas, monospace; font-size: 15px; background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 6px; }
    .message { margin: 8px 0 0; opacity: 0.9; }
    .wrap { max-width: 900px; margin: 0 auto; }
    main { margin-top: -40px; padding: 0 24px 40px; }
    .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    .card h2 { margin: 0 0 14px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; background: var(--accent); color: #fff; }
    ul { list-style: none; padding: 0; margin: 16px 0 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { background: transparent; color: var(--muted); padding: 4px 8px; }
    .empty { color: var(--muted); margin: 16px 0 0; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: Consolas, monospace; word-break: break-all; }
    .pods { margin-top: 18px; font-size: 13px; color: var(--muted); }
    .pods code { display: inline-block; margin: 4px 6px 0 0; padding: 2px 8px; border-radius: 5px; background: #eef0f4; color: var(--text); }
    .note { margin-top: 14px; font-size: 13px; color: var(--muted); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Todo App</h1>
      <span class="version" id="version">loading</span>
    </div>
    <div class="wrap"><p class="message" id="message"></p></div>
  </header>

  <main>
    <div class="wrap grid">
      <section class="card">
        <h2>Tasks</h2>
        <form id="form">
          <label for="title" class="sr-only">Task title</label>
          <input type="text" id="title" placeholder="Add a task" autocomplete="off" maxlength="200">
          <button type="submit">Add task</button>
        </form>
        <ul id="list"></ul>
        <p class="empty" id="empty">No tasks yet.</p>
        <p class="note">Tasks live in the memory of one pod, so they differ between replicas.</p>
      </section>

      <section class="card">
        <h2>Deployment</h2>
        <dl>
          <dt>Version</dt><dd id="i-version">-</dd>
          <dt>Image tag</dt><dd id="i-commit">-</dd>
          <dt>Served by</dt><dd id="i-pod">-</dd>
          <dt>Node</dt><dd id="i-node">-</dd>
          <dt>Pod started</dt><dd id="i-started">-</dd>
        </dl>
        <div class="pods">Pods seen by this browser:<br><span id="pods"></span></div>
      </section>
    </div>
  </main>

  <script>
    const seenPods = new Set();
    const $ = (id) => document.getElementById(id);

    async function refreshInfo() {
      try {
        const info = await (await fetch("/api/info", { cache: "no-store" })).json();
        document.documentElement.style.setProperty("--accent", info.theme);
        $("version").textContent = "v" + info.version;
        $("message").textContent = info.message;
        $("i-version").textContent = info.version;
        $("i-commit").textContent = info.commit.slice(0, 12);
        $("i-pod").textContent = info.pod;
        $("i-node").textContent = info.node;
        $("i-started").textContent = new Date(info.startedAt).toLocaleTimeString();
        seenPods.add(info.pod);
        $("pods").innerHTML = [...seenPods].slice(-8).map((p) => `<code>${p}</code>`).join("");
      } catch (e) {
        $("version").textContent = "rolling out";
      }
    }

    async function refreshTodos() {
      const todos = await (await fetch("/api/todos", { cache: "no-store" })).json();
      $("empty").style.display = todos.length ? "none" : "block";
      $("list").innerHTML = "";
      for (const t of todos) {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.onchange = () => fetch(`/api/todos/${t.id}`, { method: "PATCH" }).then(refreshTodos);
        const span = document.createElement("span");
        span.textContent = t.title;
        const del = document.createElement("button");
        del.type = "button";
        del.setAttribute("aria-label", `Delete ${t.title}`);
        del.textContent = "Delete";
        del.onclick = () => fetch(`/api/todos/${t.id}`, { method: "DELETE" }).then(refreshTodos);
        li.append(box, span, del);
        $("list").append(li);
      }
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = $("title").value.trim();
      if (!title) return;
      await fetch("/api/todos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      $("title").value = "";
      refreshTodos();
    });

    refreshInfo();
    refreshTodos().catch(() => {});
    setInterval(refreshInfo, 2000);
  </script>
</body>
</html>
