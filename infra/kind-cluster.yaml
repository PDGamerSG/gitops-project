# Local Kubernetes cluster named "gitops": one control plane, two workers.
# Host ports: 8080 -> ArgoCD UI, 8081 -> todo app.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30808
        hostPort: 8080
        protocol: TCP
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
